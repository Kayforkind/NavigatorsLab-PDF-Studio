name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Dependency audit (prod)
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Consistency (README test counts, Node version pins)
        run: node scripts/check-consistency.cjs
      - name: Package tests (core, cli, mcp)
        run: npm run test:packages
      - name: Build
        run: npm run build:pages
      - name: Install Playwright
        run: |
          npx playwright install chromium --with-deps
      - name: Generate fixtures
        run: node scripts/make-form-pdf.cjs
      # Serve at the PRODUCTION URL SHAPE (/pdf-studio/ subpath, exactly like
      # GitHub Pages project sites) so base-URL bugs can never pass CI.
      - name: Browser suites at production URL shape
        run: |
          node scripts/subpath-server.cjs 5198 &
          sleep 2
          node scripts/verify-fixes.cjs
          node scripts/review-e2e.cjs
          node scripts/verify-mobile.cjs
          node scripts/verify-rotate-redact.cjs
        env:
          VERIFY_BASE: http://localhost:5198/pdf-studio/
          REVIEW_BASE: http://localhost:5198/pdf-studio/
          MOBILE_BASE: http://localhost:5198/pdf-studio/
          ROTATE_BASE: http://localhost:5198/pdf-studio/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: pdf-studio-failure-context
          path: |
            docs/
          retention-days: 7
